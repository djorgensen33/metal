<!DOCTYPE html>
<html lang="da" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Vault - Album & Band Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            metalDark: '#0d0d0d',
            metalCard: '#141418',
            metalBorder: '#262630',
            metalRed: '#dc2626',
            metalRedDark: '#991b1b',
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f0f0f2;
      font-family: 'Inter', sans-serif;
    }
    .glow-red {
      text-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }
    .card-hover {
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card-hover:hover {
      transform: translateY(-4px);
      border-color: #dc2626;
      box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.2);
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #262630; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white pb-20">

  <header class="sticky top-0 z-50 bg-[#0d0d0d]/95 backdrop-blur-md border-b border-metalBorder">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="text-3xl">🤘</div>
        <div>
          <h1 class="font-cinzel text-2xl md:text-3xl font-900 tracking-wider text-white uppercase">
            Metal <span class="text-metalRed glow-red">Vault</span>
          </h1>
          <p class="text-xs text-neutral-400 font-sans tracking-wide">Album Database & Metal Nyheder</p>
        </div>
      </div>

      <!-- Nav Tabs -->
      <div class="flex items-center gap-1 bg-neutral-950 p-1 rounded-xl border border-metalBorder">
        <button id="tab-vault" onclick="switchView('vault')" class="px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all bg-metalRed text-white shadow-sm">🗄 Hoveddatabase</button>
        <button id="tab-upcoming" onclick="switchView('upcoming')" class="px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all text-neutral-400 hover:text-white">🚀 Upcoming</button>
        <button id="tab-news" onclick="switchView('news')" class="px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all text-neutral-400 hover:text-white">📰 Nyheder</button>
      </div>

      <div class="flex items-center gap-3">
        <button id="delete-selected-btn" style="display:none;" onclick="deleteSelectedAlbums()" class="bg-red-950 hover:bg-red-900 text-red-300 border border-red-900 px-3 py-2 rounded-lg text-xs font-semibold transition-all">🗑 Slet valgte (<span id="selected-count">0</span>)</button>
        <button id="add-album-btn" style="display:none;" onclick="openAddModal()" class="bg-metalRed hover:bg-red-700 text-white px-3 py-2 rounded-lg text-xs font-semibold transition-all shadow-sm">➕ Tilføj Album</button>
        <button id="sync-btn" style="display:none;" onclick="fetchAllData(true)" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-metalBorder px-3 py-2 rounded-lg text-xs font-semibold transition-all">🔄 Synkroniser</button>
        <button id="admin-auth-toggle" onclick="toggleAdminAuth()" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-400 border border-metalBorder px-3 py-2 rounded-lg text-xs font-semibold transition-all">🔐 Admin Login</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- Filter Panel (Hoveddatabase) -->
    <div id="filter-panel-container" class="bg-metalCard border border-metalBorder rounded-xl p-4 md:p-6 mb-8 flex flex-wrap gap-4 items-center justify-between shadow-lg">
      <input type="text" id="search-bar" class="flex-1 min-w-[240px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors" placeholder="🔍 Søg efter band, album, anmeldelse..." oninput="renderApp()">
      <select id="genre-filter" class="flex-1 min-w-[160px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">🏷️ Alle genrer</option>
      </select>
      <select id="year-filter" class="flex-1 min-w-[150px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">📅 Alle årstal</option>
      </select>
      <select id="rating-filter" class="flex-1 min-w-[160px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">💀 Alle karakterer</option>
        <option value="missing">Mangler karakter (0)</option>
      </select>
      <button class="bg-transparent border border-metalBorder hover:bg-neutral-800 text-neutral-400 hover:text-white px-4 py-2.5 text-sm rounded-lg transition-all" onclick="resetFilters()">↺ Nulstil</button>
    </div>

    <!-- Filter Panel (Upcoming) -->
    <div id="upcoming-filter-panel" style="display:none;" class="bg-metalCard border border-metalBorder rounded-xl p-4 md:p-6 mb-8 flex flex-wrap gap-4 items-center justify-between shadow-lg">
      <input type="text" id="upcoming-search-bar" class="flex-1 min-w-[280px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors" placeholder="🔍 Søg i upcoming (band, titel, genre)..." oninput="renderApp()">
      <select id="upcoming-genre-filter" class="flex-1 min-w-[200px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">🏷️ Alle genrer</option>
      </select>
      <button class="bg-transparent border border-metalBorder hover:bg-neutral-800 text-neutral-400 hover:text-white px-4 py-2.5 text-sm rounded-lg transition-all" onclick="resetUpcomingFilters()">↺ Nulstil</button>
    </div>

    <!-- News Header Controls (Kun for Nyhedsvisning) -->
    <div id="news-header-panel" style="display:none;" class="bg-metalCard border border-metalBorder rounded-xl p-4 md:p-6 mb-8 flex flex-col lg:flex-row gap-4 items-center justify-between shadow-lg">
      <div id="source-filters" class="flex items-center gap-2 overflow-x-auto w-full lg:w-auto pb-2 lg:pb-0">
        <button onclick="setSourceFilter('all')" class="source-pill active bg-metalRed text-white px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all shadow-sm">Alle Kilder</button>
        <button onclick="setSourceFilter('Heavymetal.dk')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all">🇩🇰 Heavymetal.dk</button>
        <button onclick="setSourceFilter('Metal Injection')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all">Metal Injection</button>
        <button onclick="setSourceFilter('MetalSucks')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all">MetalSucks</button>
        <button onclick="setSourceFilter('Loudwire')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all">Loudwire</button>
        <button onclick="setSourceFilter('Decibel Magazine')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all">Decibel Magazine</button>
      </div>
      <div class="flex items-center gap-3 w-full lg:w-auto justify-end">
        <button onclick="fetchAllNews(true)" class="flex items-center gap-2 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold transition-all">
          <svg id="refresh-icon" class="w-4 h-4 text-metalRed transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Opdater Feed</span>
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div id="content-container">
      <div class="flex flex-col items-center justify-center py-20">
        <div class="w-12 h-12 border-4 border-metalBorder border-t-metalRed rounded-full animate-spin mb-4"></div>
        <p class="text-neutral-400 font-medium">Indlæser Metal Vault...</p>
      </div>
    </div>

  </main>

  <!-- Album Modal -->
  <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden" id="album-modal" onclick="closeModal('album-modal')">
    <div class="bg-metalCard border border-metalBorder rounded-2xl w-full max-w-lg p-6 md:p-8 relative max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <h2 id="album-modal-title" class="font-cinzel text-xl font-bold text-metalRed mb-6">Tilføj Album</h2>
      <input type="hidden" id="album-edit-id">

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Band / Artist</label>
          <input type="text" id="album-artist" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="f.eks. Judas Priest">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Albumtitel</label>
          <input type="text" id="album-title" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="f.eks. Invincible Shield">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Udgivelsesdato</label>
          <input type="date" id="album-date" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Genre</label>
          <input type="text" id="album-genre" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="f.eks. Heavy Metal">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Karakter (1 - 10)</label>
          <select id="album-rating" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed cursor-pointer">
            <option value="0">Ingen karakter endnu</option>
            <option value="1">1 / 10</option><option value="2">2 / 10</option><option value="3">3 / 10</option>
            <option value="4">4 / 10</option><option value="5">5 / 10</option><option value="6">6 / 10</option>
            <option value="7">7 / 10</option><option value="8">8 / 10</option><option value="9">9 / 10</option>
            <option value="10">10 / 10 - Mesterværk</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Album Cover URL</label>
          <input type="url" id="album-cover" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="https://..." oninput="updateCoverPreview(this.value)">
          <img id="modal-cover-preview" class="w-full h-48 object-contain bg-black border border-metalBorder rounded-lg mt-3 hidden" alt="Forhåndsvisning" onerror="this.style.display='none'">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Spotify Link</label>
          <input type="url" id="album-spotify" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="https://open.spotify.com/album/...">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Kommentar / Anmeldelse</label>
          <textarea id="album-review" rows="3" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-4 py-2.5 text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="Tanker om pladen..."></textarea>
        </div>
      </div>

      <div class="mt-6">
        <button onclick="saveAlbum()" class="w-full bg-metalRed hover:bg-red-700 text-white font-semibold py-3 rounded-lg transition-all shadow-md">💾 Gem Ændringer</button>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeCVcVM7W7nrXKePgb3FZe2DynG0hUE6yc6eMigxUNXu4FPqHS0wLb0RdgodbhVnA/exec';

    let library = [];
    let newsList = [];
    let activeSource = 'all';
    let currentSort = { column: 'artist', asc: true };
    let upcomingSort = { column: 'date', asc: true };
    let currentView = 'vault';
    let isAdmin = localStorage.getItem('metal_vault_admin') === 'true';

    const SOURCES = [
      { name: 'Heavymetal.dk', badgeColor: 'bg-red-950 text-red-400 border-red-900', url: 'https://heavymetal.dk/rss.xml' },
      { name: 'Metal Injection', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://metalinjection.net/feed' },
      { name: 'MetalSucks', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://www.metalsucks.net/feed/' },
      { name: 'Loudwire', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://loudwire.com/feed/' },
      { name: 'Decibel Magazine', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://www.decibelmagazine.com/feed/' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      updateAdminUI();
      const cachedVault = localStorage.getItem('metal_vault_cache');
      if (cachedVault) {
        try { library = JSON.parse(cachedVault); } catch(e) {}
      }
      
      populateFilterDropdowns();
      renderApp();
      fetchAllData(library.length === 0);
      fetchAllNews(false);
    });

    function toggleAdminAuth() {
      if (isAdmin) {
        if (confirm('Vil du logge ud af admin-tilstand?')) {
          isAdmin = false;
          localStorage.setItem('metal_vault_admin', 'false');
          updateAdminUI();
          renderApp();
        }
      } else {
        const pass = prompt('Indtast adgangskode for at redigere:');
        if (pass === 'metal123') {
          isAdmin = true;
          localStorage.setItem('metal_vault_admin', 'true');
          alert('Du er nu logget ind som Admin!');
          updateAdminUI();
          renderApp();
        } else if (pass !== null) {
          alert('Forkert adgangskode!');
        }
      }
    }

    function updateAdminUI() {
      const btn = document.getElementById('admin-auth-toggle');
      const addBtn = document.getElementById('add-album-btn');
      const syncBtn = document.getElementById('sync-btn');
      
      if (isAdmin) {
        btn.innerText = '🔓 Log ud (Admin)';
        btn.classList.add('bg-emerald-950', 'text-emerald-400', 'border-emerald-900');
        if (addBtn) addBtn.style.display = 'inline-flex';
        if (syncBtn) syncBtn.style.display = 'inline-flex';
      } else {
        btn.innerText = '🔐 Admin Login';
        btn.classList.remove('bg-emerald-950', 'text-emerald-400', 'border-emerald-900');
        if (addBtn) addBtn.style.display = 'none';
        if (syncBtn) syncBtn.style.display = 'none';
      }
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-vault').className = view === 'vault' ? 'px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all bg-metalRed text-white shadow-sm' : 'px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all text-neutral-400 hover:text-white';
      document.getElementById('tab-upcoming').className = view === 'upcoming' ? 'px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all bg-metalRed text-white shadow-sm' : 'px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all text-neutral-400 hover:text-white';
      document.getElementById('tab-news').className = view === 'news' ? 'px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all bg-metalRed text-white shadow-sm' : 'px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition-all text-neutral-400 hover:text-white';
      
      document.getElementById('filter-panel-container').style.display = (view === 'vault') ? 'flex' : 'none';
      document.getElementById('upcoming-filter-panel').style.display = (view === 'upcoming') ? 'flex' : 'none';
      document.getElementById('news-header-panel').style.display = (view === 'news') ? 'flex' : 'none';
      
      renderApp();
    }

    function fetchAllData(showLoadingMsg) {
      const container = document.getElementById('content-container');
      if (showLoadingMsg && library.length === 0 && container) {
        container.innerHTML = '<div class="flex flex-col items-center justify-center py-20"><div class="w-12 h-12 border-4 border-metalBorder border-t-metalRed rounded-full animate-spin mb-4"></div><p class="text-neutral-400 font-medium">Henter database fra Google Sheets...</p></div>';
      }

      fetch(SCRIPT_URL + '?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            library = data;
            localStorage.setItem('metal_vault_cache', JSON.stringify(library));
            populateFilterDropdowns();
            renderApp();
          }
        })
        .catch(err => console.error('Fejl ved hentning af album:', err));
    }

    async function fetchAllNews(isManualRefresh) {
      const refreshIcon = document.getElementById('refresh-icon');
      if (isManualRefresh && refreshIcon) refreshIcon.classList.add('animate-spin');

      let fetchedArticles = [];
      const fetchPromises = SOURCES.map(async (src) => {
        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`;
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data && data.status === 'ok' && Array.isArray(data.items)) {
            return data.items.map(item => {
              let imageUrl = item.thumbnail || (item.enclosure ? item.enclosure.link : null);
              if (!imageUrl && item.content) {
                const imgMatch = item.content.match(/src="([^"]+)"/);
                if (imgMatch) imageUrl = imgMatch[1];
              }

              let cleanSnippet = item.description || item.content || '';
              cleanSnippet = cleanSnippet.replace(/<\/?[^>]+(>|$)/g, "");
              if (cleanSnippet.length > 180) {
                cleanSnippet = cleanSnippet.substring(0, 180) + '...';
              }

              return {
                title: item.title || 'Uden titel',
                link: item.link || '#',
                pubDate: item.pubDate || new Date().toISOString(),
                source: src.name,
                snippet: cleanSnippet || 'Ingen beskrivelse tilgængelig.',
                image: imageUrl || `https://placehold.co/600x400/141418/dc2626?text=${encodeURIComponent(src.name)}`
              };
            });
          }
        } catch (err) {
          console.warn(`Kunne ikke hente feed fra ${src.name}:`, err);
        }
        return [];
      });

      const results = await Promise.all(fetchPromises);
      results.forEach(articles => {
        if (articles && articles.length > 0) {
          fetchedArticles = fetchedArticles.concat(articles);
        }
      });

      if (fetchedArticles.length > 0) {
        fetchedArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        newsList = fetchedArticles;
      }

      if (isManualRefresh && refreshIcon) {
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
      }

      if (currentView === 'news') {
        renderApp();
      }
    }

    function sendToSheet(paramsObj) {
      const queryParams = new URLSearchParams(paramsObj);
      queryParams.append('t', new Date().getTime());
      fetch(SCRIPT_URL + '?' + queryParams.toString(), { method: 'GET', mode: 'no-cors' })
        .then(() => {
          setTimeout(() => {
            localStorage.removeItem('metal_vault_cache');
            fetchAllData(false);
          }, 1500);
        })
        .catch(err => console.error('Synkroniseringsfejl:', err));
    }

    function populateFilterDropdowns() {
      const genreSelect = document.getElementById('genre-filter');
      const yearSelect = document.getElementById('year-filter');
      const upcomingGenreSelect = document.getElementById('upcoming-genre-filter');
      if (!genreSelect || !yearSelect || !upcomingGenreSelect) return;
      
      const currentGenre = genreSelect.value;
      const currentYear = yearSelect.value;
      const currentUpcomingGenre = upcomingGenreSelect.value;

      const genres = [...new Set(library.map(i => String(i.genre || '').trim()).filter(Boolean))].sort();
      const years = [...new Set(library.map(i => {
        if (!i.date) return '';
        const d = addOneDay(i.date);
        return d && !isNaN(d) ? d.getFullYear() : '';
      }).filter(Boolean))].sort((a, b) => b - a);

      genreSelect.innerHTML = '<option value="">🏷️ Alle genrer</option>' + genres.map(g => `<option value="${g}">${g}</option>`).join('');
      yearSelect.innerHTML = '<option value="">📅 Alle årstal</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
      upcomingGenreSelect.innerHTML = '<option value="">🏷️ Alle genrer</option>' + genres.map(g => `<option value="${g}">${g}</option>`).join('');

      genreSelect.value = currentGenre;
      yearSelect.value = currentYear;
      upcomingGenreSelect.value = currentUpcomingGenre;
    }

    function updateCoverPreview(url) {
      const preview = document.getElementById('modal-cover-preview');
      if (!preview) return;
      if (url && url.trim() !== '') {
        preview.src = url;
        preview.classList.remove('hidden');
      } else {
        preview.classList.add('hidden');
      }
    }

    function openAddModal() {
      if (!isAdmin) return;
      document.getElementById('album-modal').classList.remove('hidden');
      document.getElementById('album-modal-title').innerText = 'Tilføj Nyt Album';
      document.getElementById('album-edit-id').value = '';
      document.getElementById('album-artist').value = '';
      document.getElementById('album-title').value = '';
      document.getElementById('album-date').value = '';
      document.getElementById('album-genre').value = '';
      document.getElementById('album-rating').value = 0;
      document.getElementById('album-cover').value = '';
      document.getElementById('album-spotify').value = '';
      document.getElementById('album-review').value = '';
      updateCoverPreview('');
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function saveAlbum() {
      const itemData = {
        artist: document.getElementById('album-artist').value,
        title: document.getElementById('album-title').value,
        date: document.getElementById('album-date').value,
        genre: document.getElementById('album-genre').value,
        rating: parseInt(document.getElementById('album-rating').value) || 0,
        cover: document.getElementById('album-cover').value,
        spotify: document.getElementById('album-spotify').value,
        review: document.getElementById('album-review').value
      };
      
      const idx = library.findIndex(i => (i.artist||'').trim().toLowerCase() === itemData.artist.trim().toLowerCase() && (i.title||'').trim().toLowerCase() === itemData.title.trim().toLowerCase());
      if (idx !== -1) {
        library[idx] = Object.assign({}, library[idx], itemData);
      } else {
        library.push(itemData);
      }
      localStorage.setItem('metal_vault_cache', JSON.stringify(library));
      populateFilterDropdowns();
      renderApp();

      sendToSheet(Object.assign({ action: 'save' }, itemData));
      closeModal('album-modal');
    }

    function updateRatingDirect(id, newRating, event) {
      if (event) event.stopPropagation();
      if (!isAdmin) return;
      const item = library.find(i => String(i.id) === String(id));
      if (!item) return;
      
      item.rating = parseInt(newRating) || 0;
      localStorage.setItem('metal_vault_cache', JSON.stringify(library));
      renderApp();
      
      sendToSheet({ action: 'updaterating', artist: item.artist || '', title: item.title || '', rating: item.rating });
    }

    function resetFilters() {
      document.getElementById('search-bar').value = '';
      document.getElementById('genre-filter').value = '';
      document.getElementById('year-filter').value = '';
      document.getElementById('rating-filter').value = '';
      renderApp();
    }

    function resetUpcomingFilters() {
      document.getElementById('upcoming-search-bar').value = '';
      document.getElementById('upcoming-genre-filter').value = '';
      renderApp();
    }

    function sortTable(column) {
      if (currentSort.column === column) {
        currentSort.asc = !currentSort.asc;
      } else {
        currentSort.column = column;
        currentSort.asc = true;
      }
      renderApp();
    }

    function sortUpcomingTable(column) {
      if (upcomingSort.column === column) {
        upcomingSort.asc = !upcomingSort.asc;
      } else {
        upcomingSort.column = column;
        upcomingSort.asc = true;
      }
      renderApp();
    }

    function toggleSelectAll(master) {
      document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = master.checked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const checked = document.querySelectorAll('.row-checkbox:checked');
      const countSpan = document.getElementById('selected-count');
      const deleteBtn = document.getElementById('delete-selected-btn');
      if (countSpan && deleteBtn) {
        countSpan.innerText = checked.length;
        deleteBtn.style.display = (isAdmin && checked.length > 0) ? 'inline-flex' : 'none';
      }
    }

    function deleteSelectedAlbums() {
      if (!isAdmin) return;
      const checked = document.querySelectorAll('.row-checkbox:checked');
      if (checked.length === 0) return;

      if (!confirm(`Er du sikker på, at du vil slette ${checked.length} valgte album?`)) return;

      const keysToDelete = Array.from(checked).map(cb => cb.getAttribute('data-key'));
      library = library.filter(i => !keysToDelete.includes((i.artist + '___' + i.title)));

      localStorage.setItem('metal_vault_cache', JSON.stringify(library));
      populateFilterDropdowns();
      renderApp();

      keysToDelete.forEach(k => {
        const parts = k.split('___');
        sendToSheet({ action: 'delete', artist: parts[0], title: parts[1] });
      });
    }

    function addOneDay(dateString) {
      if (!dateString) return null;
      const d = new Date(dateString);
      if (isNaN(d)) return null;
      d.setDate(d.getDate() + 1);
      return d;
    }

    function setSourceFilter(sourceName) {
      activeSource = sourceName;
      document.querySelectorAll('.source-pill').forEach(btn => {
        if (btn.textContent.includes(sourceName) || (sourceName === 'all' && btn.textContent === 'Alle Kilder')) {
          btn.className = 'source-pill active bg-metalRed text-white px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all shadow-sm';
        } else {
          btn.className = 'source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-4 py-2 rounded-lg text-sm font-semibold whitespace-nowrap transition-all';
        }
      });
      renderApp();
    }

    function renderApp() {
      const container = document.getElementById('content-container');
      if (!container) return;

      if (currentView === 'news') {
        renderNewsView(container);
        return;
      }

      if (currentView === 'upcoming') {
        renderUpcomingView(container);
        return;
      }

      // Hoveddatabase (Vault med 5 kranier og Cover Thumbnail)
      const searchVal = (document.getElementById('search-bar')?.value || '').toLowerCase();
      const genreVal = document.getElementById('genre-filter')?.value || '';
      const yearVal = document.getElementById('year-filter')?.value || '';
      const ratingVal = document.getElementById('rating-filter')?.value || '';

      let filtered = library.filter(item => {
        const artist = String(item.artist || '').toLowerCase();
        const title = String(item.title || '').toLowerCase();
        const genre = String(item.genre || '').toLowerCase();
        const review = String(item.review || '').toLowerCase();

        const matchesSearch = !searchVal || artist.includes(searchVal) || title.includes(searchVal) || genre.includes(searchVal) || review.includes(searchVal);
        const matchesGenre = !genreVal || String(item.genre || '').trim() === genreVal;
        
        let matchesYear = true;
        if (yearVal) {
          const d = addOneDay(item.date);
          matchesYear = d && !isNaN(d) && String(d.getFullYear()) === yearVal;
        }

        let matchesRating = true;
        if (ratingVal === 'missing') {
          matchesRating = (!item.rating || parseInt(item.rating) === 0);
        }

        return matchesSearch && matchesGenre && matchesYear && matchesRating;
      });

      filtered.sort((a, b) => {
        let valA = a[currentSort.column] || '';
        let valB = b[currentSort.column] || '';

        if (currentSort.column === 'rating') {
          valA = parseInt(valA) || 0;
          valB = parseInt(valB) || 0;
        } else if (currentSort.column === 'date') {
          valA = valA ? new Date(valA).getTime() : 0;
          valB = valB ? new Date(valB).getTime() : 0;
        } else {
          valA = String(valA).toLowerCase();
          valB = String(valB).toLowerCase();
        }

        if (valA < valB) return currentSort.asc ? -1 : 1;
        if (valA > valB) return currentSort.asc ? 1 : -1;
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-metalCard border border-metalBorder rounded-xl text-center py-16 text-neutral-400">Ingen metal-albums fundet i databasen.</div>';
        return;
      }

      let html = `
        <div class="bg-metalCard border border-metalBorder rounded-xl overflow-x-auto shadow-xl">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-neutral-900/85 text-neutral-400 text-xs font-semibold uppercase tracking-wider border-b border-metalBorder">
                ${isAdmin ? '<th class="p-4 w-10"><input type="checkbox" onclick="toggleSelectAll(this)"></th>' : ''}
                <th class="p-4 w-16 text-center">Cover</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortTable('artist')">Band / Artist ${currentSort.column === 'artist' ? (currentSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortTable('title')">Albumtitel ${currentSort.column === 'title' ? (currentSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortTable('date')">Udgivelsesdato ${currentSort.column === 'date' ? (currentSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortTable('genre')">Genre ${currentSort.column === 'genre' ? (currentSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortTable('rating')">Karakter ${currentSort.column === 'rating' ? (currentSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4">Spotify</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-metalBorder text-sm">
      `;

      filtered.forEach(item => {
        const rating = parseInt(item.rating) || 0;
        const isMissingRating = rating === 0;
        const rowClass = isMissingRating ? 'hover:bg-red-950/20 bg-red-950/10 cursor-pointer transition-colors' : 'hover:bg-neutral-900/50 cursor-pointer transition-colors';
        const uniqueKey = (item.artist || '') + '___' + (item.title || '');

        let skullsHtml = '';
        for (let s = 1; s <= 5; s++) {
          const skullValue = s * 2;
          let skullStyle = 'color: #3f3f46;';
          let titleText = `${s * 2 - 1}-${s * 2}/10`;

          if (rating >= skullValue) {
            skullStyle = 'color: #dc2626; filter: drop-shadow(0 0 6px rgba(220,38,38,0.7));';
          } else if (rating === skullValue - 1) {
            skullStyle = 'background: linear-gradient(90deg, #dc2626 50%, #3f3f46 50%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;';
          }

          skullsHtml += `<span class="text-base cursor-pointer hover:scale-125 transition-transform inline-block" style="${skullStyle}" onclick="updateRatingDirect('${item.id || uniqueKey}', ${skullValue}, event)" title="${titleText}">💀</span>`;
        }

        let formattedDate = '-';
        if (item.date) {
          const d = addOneDay(item.date);
          if (d && !isNaN(d)) {
            formattedDate = d.toLocaleDateString('da-DK', { year: 'numeric', month: 'short', day: 'numeric' });
          }
        }

        html += `
          <tr class="${rowClass}" onclick="openEditModalFromRow('${encodeURIComponent(uniqueKey)}')">
            ${isAdmin ? `<td class="p-4" onclick="event.stopPropagation()"><input type="checkbox" class="row-checkbox" data-key="${uniqueKey}" onclick="updateSelectedCount()"></td>` : ''}
            <td class="p-3 text-center">
              ${item.cover ? `<img src="${item.cover}" alt="Cover" class="w-10 h-10 object-cover rounded bg-neutral-950 border border-metalBorder mx-auto" onerror="this.style.display='none'">` : '<div class="w-10 h-10 rounded bg-neutral-900 border border-metalBorder flex items-center justify-center text-xs mx-auto">💿</div>'}
            </td>
            <td class="p-4 font-bold text-neutral-100">${item.artist || '-'}</td>
            <td class="p-4 text-neutral-300">${item.title || '-'}</td>
            <td class="p-4 text-neutral-400">${formattedDate}</td>
            <td class="p-4 text-neutral-400">${item.genre || '-'}</td>
            <td class="p-4">
              <div class="flex items-center gap-1.5">
                <div class="flex items-center gap-0.5">${skullsHtml}</div>
                <span class="text-xs font-semibold text-neutral-400 ml-1">${rating > 0 ? rating + '/10' : 'Mangler'}</span>
              </div>
            </td>
            <td class="p-4">
              ${item.spotify ? `<a href="${item.spotify}" target="_blank" onclick="event.stopPropagation()" class="text-emerald-400 hover:text-emerald-300 font-semibold text-sm flex items-center gap-1.5">🎧 Lyt</a>` : '-'}
            </td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      container.innerHTML = html;
      updateSelectedCount();
    }

    function renderUpcomingView(container) {
      const today = new Date();
      today.setHours(0,0,0,0);

      const searchVal = (document.getElementById('upcoming-search-bar')?.value || '').toLowerCase();
      const genreVal = document.getElementById('upcoming-genre-filter')?.value || '';

      const upcoming = library.filter(item => {
        if (!item.date) return false;
        const d = addOneDay(item.date);
        if (!d || isNaN(d) || d < today) return false;

        const artist = String(item.artist || '').toLowerCase();
        const title = String(item.title || '').toLowerCase();
        const genre = String(item.genre || '').toLowerCase();
        const review = String(item.review || '').toLowerCase();

        const matchesSearch = !searchVal || artist.includes(searchVal) || title.includes(searchVal) || genre.includes(searchVal) || review.includes(searchVal);
        const matchesGenre = !genreVal || String(item.genre || '').trim() === genreVal;

        return matchesSearch && matchesGenre;
      });

      upcoming.sort((a, b) => {
        let valA = a[upcomingSort.column] || '';
        let valB = b[upcomingSort.column] || '';

        if (upcomingSort.column === 'date') {
          valA = valA ? new Date(valA).getTime() : 0;
          valB = valB ? new Date(valB).getTime() : 0;
        } else {
          valA = String(valA).toLowerCase();
          valB = String(valB).toLowerCase();
        }

        if (valA < valB) return upcomingSort.asc ? -1 : 1;
        if (valA > valB) return upcomingSort.asc ? 1 : -1;
        return 0;
      });

      if (upcoming.length === 0) {
        container.innerHTML = '<div class="bg-metalCard border border-metalBorder rounded-xl text-center py-16 text-neutral-400">Ingen upcoming albums fundet, der matcher din søgning.</div>';
        return;
      }

      let html = `
        <div class="bg-metalCard border border-metalBorder rounded-xl overflow-x-auto shadow-xl">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-neutral-900/85 text-neutral-400 text-xs font-semibold uppercase tracking-wider border-b border-metalBorder">
                <th class="p-4 w-16 text-center">Cover</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortUpcomingTable('artist')">Band / Artist ${upcomingSort.column === 'artist' ? (upcomingSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortUpcomingTable('title')">Albumtitel ${upcomingSort.column === 'title' ? (upcomingSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortUpcomingTable('date')">Udgivelsesdato ${upcomingSort.column === 'date' ? (upcomingSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4 cursor-pointer hover:text-white" onclick="sortUpcomingTable('genre')">Genre ${upcomingSort.column === 'genre' ? (upcomingSort.asc ? '▲' : '▼') : ''}</th>
                <th class="p-4">Status</th>
                <th class="p-4">Spotify</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-metalBorder text-sm">
      `;

      upcoming.forEach(item => {
        const d = addOneDay(item.date);
        const diffTime = d - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        let badgeText = `Om ${diffDays} dage`;
        let badgeClass = 'bg-red-950 text-red-400 border-red-900';
        if (diffDays === 0) {
          badgeText = 'Udgives i dag! 🎸';
          badgeClass = 'bg-emerald-950 text-emerald-400 border-emerald-900';
        } else if (diffDays === 1) {
          badgeText = 'Udgives i morgen';
        }

        let formattedDate = d.toLocaleDateString('da-DK', { year: 'numeric', month: 'short', day: 'numeric' });
        const uniqueKey = (item.artist || '') + '___' + (item.title || '');

        html += `
          <tr class="hover:bg-neutral-900/50 cursor-pointer transition-colors" onclick="openEditModalFromRow('${encodeURIComponent(uniqueKey)}')">
            <td class="p-3 text-center">
              ${item.cover ? `<img src="${item.cover}" alt="Cover" class="w-10 h-10 object-cover rounded bg-neutral-950 border border-metalBorder mx-auto" onerror="this.style.display='none'">` : '<div class="w-10 h-10 rounded bg-neutral-900 border border-metalBorder flex items-center justify-center text-xs mx-auto">💿</div>'}
            </td>
            <td class="p-4 font-bold text-neutral-100">${item.artist || '-'}</td>
            <td class="p-4 text-neutral-300">${item.title || '-'}</td>
            <td class="p-4 text-neutral-400">${formattedDate}</td>
            <td class="p-4 text-neutral-400">${item.genre || '-'}</td>
            <td class="p-4">
              <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${badgeClass} inline-block">${badgeText}</span>
            </td>
            <td class="p-4">
              ${item.spotify ? `<a href="${item.spotify}" target="_blank" onclick="event.stopPropagation()" class="text-emerald-400 hover:text-emerald-300 font-semibold text-sm flex items-center gap-1.5">🎧 Lyt</a>` : '-'}
            </td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      container.innerHTML = html;
    }

    function renderNewsView(container) {
      let filteredNews = newsList;
      if (activeSource !== 'all') {
        filteredNews = newsList.filter(n => n.source === activeSource);
      }

      if (filteredNews.length === 0) {
        container.innerHTML = `
          <div class="bg-metalCard border border-metalBorder rounded-xl text-center py-16">
            <div class="w-10 h-10 border-4 border-metalBorder border-t-metalRed rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-neutral-400 text-lg">Henter nyheder fra RSS-feeds...</p>
          </div>
        `;
        return;
      }

      let html = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
      filteredNews.forEach(item => {
        const sourceObj = SOURCES.find(s => s.name === item.source);
        const badgeClass = sourceObj ? sourceObj.badgeColor : 'bg-red-950 text-red-400 border-red-900';
        
        let formattedDate = '';
        try {
          const d = new Date(item.pubDate);
          if (!isNaN(d)) {
            formattedDate = d.toLocaleDateString('da-DK', { day: 'numeric', month: 'short', year: 'numeric' });
          } else {
            formattedDate = item.pubDate;
          }
        } catch(e) {
          formattedDate = item.pubDate;
        }

        html += `
          <article class="bg-metalCard border border-metalBorder rounded-xl overflow-hidden flex flex-col card-hover">
            <div class="h-48 overflow-hidden bg-neutral-950 relative border-b border-metalBorder">
              <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover transition-transform duration-300 hover:scale-105" onerror="this.src='https://placehold.co/600x400/141418/dc2626?text=Metal+News'">
              <div class="absolute top-3 left-3">
                <span class="text-xs font-bold px-2.5 py-1 rounded-md border ${badgeClass} uppercase tracking-wider backdrop-blur-md bg-opacity-90">
                  ${item.source}
                </span>
              </div>
            </div>
            
            <div class="p-5 flex flex-col flex-1">
              <div class="text-xs text-neutral-400 mb-2 flex items-center gap-1.5 font-medium">
                <svg class="w-3.5 h-3.5 text-metalRed" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>${formattedDate}</span>
              </div>

              <h2 class="font-cinzel text-lg font-bold text-neutral-100 mb-3 line-clamp-2 hover:text-metalRed transition-colors">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
              </h2>

              <p class="text-sm text-neutral-400 mb-6 line-clamp-3 flex-1">
                ${item.snippet}
              </p>

              <div class="pt-4 border-t border-metalBorder mt-auto">
                <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-sm font-semibold text-metalRed hover:text-red-400 transition-colors">
                  <span>Læs mere på kilden</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
              </div>
            </div>
          </article>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;
    }

    function openEditModalFromRow(encodedKey) {
      if (!isAdmin) return;
      const uniqueKey = decodeURIComponent(encodedKey);
      const parts = uniqueKey.split('___');
      const item = library.find(i => (i.artist || '') === parts[0] && (i.title || '') === parts[1]);
      if (!item) return;

      document.getElementById('album-modal').classList.remove('hidden');
      document.getElementById('album-modal-title').innerText = 'Rediger Album';
      document.getElementById('album-artist').value = item.artist || '';
      document.getElementById('album-title').value = item.title || '';
      document.getElementById('album-date').value = item.date ? String(item.date).split('T')[0] : '';
      document.getElementById('album-genre').value = item.genre || '';
      document.getElementById('album-rating').value = item.rating || 0;
      document.getElementById('album-cover').value = item.cover || '';
      document.getElementById('album-spotify').value = item.spotify || '';
      document.getElementById('album-review').value = item.review || '';
      updateCoverPreview(item.cover || '');
    }
  </script>
</body>
</html>
