<!DOCTYPE html>
<html lang="da" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Metal Vault - Album & Band Database</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            metalDark: '#0d0d0d',
            metalCard: '#141418',
            metalBorder: '#262630',
            metalRed: '#dc2626',
            metalRedDark: '#991b1b',
          },
          fontFamily: {
            cinzel: ['Cinzel', 'serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #0d0d0d;
      color: #f0f0f2;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    .glow-red {
      text-shadow: 0 0 15px rgba(220, 38, 38, 0.6);
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0d0d0d; }
    ::-webkit-scrollbar-thumb { background: #262630; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-red-600 selection:text-white pb-20">

  <header class="sticky top-0 z-50 bg-[#0d0d0d]/95 backdrop-blur-md border-b border-metalBorder">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
      <div class="flex items-center justify-between w-full md:w-auto">
        <div class="flex items-center gap-3">
          <div class="text-2xl md:text-3xl">🤘</div>
          <div>
            <h1 class="font-cinzel text-xl md:text-3xl font-900 tracking-wider text-white uppercase">
              Metal <span class="text-metalRed glow-red">Vault</span>
            </h1>
            <p class="text-[11px] md:text-xs text-neutral-400 font-sans tracking-wide">Album Database & Metal Nyheder</p>
          </div>
        </div>
      </div>

      <!-- Nav Tabs -->
      <div class="flex items-center gap-1 bg-neutral-950 p-1 rounded-xl border border-metalBorder overflow-x-auto max-w-full">
        <button id="tab-vault" onclick="switchView('vault')" class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all bg-metalRed text-white shadow-sm whitespace-nowrap">🗄 Database</button>
        <button id="tab-upcoming" onclick="switchView('upcoming')" class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap">🚀 Upcoming</button>
        <button id="tab-worklist" onclick="switchView('worklist')" style="display:none;" class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap">📋 Worklist <span id="worklist-badge-count" class="bg-amber-900/60 text-amber-300 px-1.5 py-0.5 rounded text-[10px] ml-0.5">(0)</span></button>
        <button id="tab-news" onclick="switchView('news')" class="px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap">📰 Nyheder</button>
      </div>

      <div class="flex items-center gap-2 flex-wrap justify-center">
        <button id="delete-selected-btn" style="display:none;" onclick="deleteSelectedAlbums()" class="bg-red-950 hover:bg-red-900 text-red-300 border border-red-900 px-2 py-1.5 rounded-lg text-[11px] font-semibold transition-all">🗑 Slet (<span id="selected-count">0</span>)</button>
        <button id="add-album-btn" style="display:none;" onclick="openAddModal()" class="bg-metalRed hover:bg-red-700 text-white px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition-all shadow-sm">➕ Tilføj</button>
        <button id="sync-btn" style="display:none;" onclick="fetchAllData(true)" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-metalBorder px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition-all">🔄 Synk</button>
        <button id="admin-auth-toggle" onclick="toggleAdminAuth()" class="bg-neutral-900 hover:bg-neutral-800 text-neutral-400 border border-metalBorder px-2.5 py-1.5 rounded-lg text-[11px] font-semibold transition-all">🔐 Admin</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-6">
    
    <!-- Filter Panel (Hoveddatabase) -->
    <div id="filter-panel-container" class="bg-metalCard border border-metalBorder rounded-xl p-3 sm:p-6 mb-6 flex flex-col sm:flex-row flex-wrap gap-3 items-center justify-between shadow-lg">
      <input type="text" id="search-bar" class="w-full sm:flex-1 sm:min-w-[200px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors" placeholder="🔍 Søg efter band, album, anmeldelse..." oninput="renderApp()">
      <select id="genre-filter" class="w-full sm:flex-1 sm:min-w-[140px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">🏷️ Alle genrer</option>
      </select>
      <select id="year-filter" class="w-full sm:flex-1 sm:min-w-[130px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">📅 Alle årstal</option>
      </select>
      <select id="rating-filter" class="w-full sm:flex-1 sm:min-w-[140px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">💀 Alle karakterer</option>
        <option value="missing">Mangler karakter (0)</option>
      </select>
      <button class="w-full sm:w-auto bg-transparent border border-metalBorder hover:bg-neutral-800 text-neutral-400 hover:text-white px-3 py-2 text-xs sm:text-sm rounded-lg transition-all" onclick="resetFilters()">↺ Nulstil</button>
    </div>

    <!-- Filter Panel (Upcoming) -->
    <div id="upcoming-filter-panel" style="display:none;" class="bg-metalCard border border-metalBorder rounded-xl p-3 sm:p-6 mb-6 flex flex-col sm:flex-row flex-wrap gap-3 items-center justify-between shadow-lg">
      <input type="text" id="upcoming-search-bar" class="w-full sm:flex-1 sm:min-w-[220px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors" placeholder="🔍 Søg i upcoming (band, titel, genre)..." oninput="renderApp()">
      <select id="upcoming-genre-filter" class="w-full sm:flex-1 sm:min-w-[160px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors cursor-pointer" onchange="renderApp()">
        <option value="">🏷️ Alle genrer</option>
      </select>
      <button class="w-full sm:w-auto bg-transparent border border-metalBorder hover:bg-neutral-800 text-neutral-400 hover:text-white px-3 py-2 text-xs sm:text-sm rounded-lg transition-all" onclick="resetUpcomingFilters()">↺ Nulstil</button>
    </div>

    <!-- Filter Panel (Worklist) -->
    <div id="worklist-filter-panel" style="display:none;" class="bg-metalCard border border-amber-900/50 rounded-xl p-3 sm:p-6 mb-6 flex flex-col sm:flex-row flex-wrap gap-3 items-center justify-between shadow-lg">
      <div class="flex items-center gap-3">
        <span class="text-xl">⚠️</span>
        <div>
          <h3 class="font-cinzel text-xs sm:text-sm font-bold text-amber-400">Administrations Worklist</h3>
          <p class="text-[11px] sm:text-xs text-neutral-400">Viser udgivne elementer, der mangler data.</p>
        </div>
      </div>
      <input type="text" id="worklist-search-bar" class="w-full sm:flex-1 sm:min-w-[200px] bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 py-2 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed transition-colors" placeholder="🔍 Filtrer worklist..." oninput="renderApp()">
    </div>

    <!-- News Header Controls -->
    <div id="news-header-panel" style="display:none;" class="bg-metalCard border border-metalBorder rounded-xl p-3 sm:p-6 mb-6 flex flex-col lg:flex-row gap-3 items-center justify-between shadow-lg">
      <div id="source-filters" class="flex items-center gap-2 overflow-x-auto w-full lg:w-auto pb-2 lg:pb-0">
        <button onclick="setSourceFilter('all')" class="source-pill active bg-metalRed text-white px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all shadow-sm">Alle Kilder</button>
        <button onclick="setSourceFilter('Heavymetal.dk')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">🇩🇰 Heavymetal.dk</button>
        <button onclick="setSourceFilter('Metal Injection')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">Metal Injection</button>
        <button onclick="setSourceFilter('MetalSucks')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">MetalSucks</button>
        <button onclick="setSourceFilter('Loudwire')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">Loudwire</button>
        <button onclick="setSourceFilter('Decibel Magazine')" class="source-pill bg-neutral-900 text-neutral-400 hover:text-white border border-metalBorder px-3 py-1.5 rounded-lg text-xs font-semibold whitespace-nowrap transition-all">Decibel Magazine</button>
      </div>
      <div class="flex items-center gap-3 w-full lg:w-auto justify-end">
        <button onclick="fetchAllNews(true)" class="flex items-center gap-2 bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-metalBorder px-3 py-1.5 rounded-lg text-xs font-semibold transition-all">
          <svg id="refresh-icon" class="w-4 h-4 text-metalRed transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
          <span>Opdater Feed</span>
        </button>
      </div>
    </div>

    <!-- Main Content Container -->
    <div id="content-container">
      <div class="flex flex-col items-center justify-center py-20">
        <div class="w-12 h-12 border-4 border-metalBorder border-t-metalRed rounded-full animate-spin mb-4"></div>
        <p class="text-neutral-400 font-medium">Indlæser Metal Vault...</p>
      </div>
    </div>

  </main>

  <!-- Album Modal -->
  <div class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4 hidden" id="album-modal" onclick="closeModal('album-modal')">
    <div class="bg-metalCard border border-metalBorder rounded-2xl w-full max-w-lg p-5 sm:p-8 relative max-h-[90vh] overflow-y-auto" onclick="event.stopPropagation()">
      <h2 id="album-modal-title" class="font-cinzel text-lg sm:text-xl font-bold text-metalRed mb-4 sm:mb-6">Tilføj Album</h2>
      <input type="hidden" id="album-edit-id">

      <div class="space-y-3 sm:space-y-4">
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Band / Artist</label>
          <input type="text" id="album-artist" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="f.eks. Judas Priest">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Albumtitel</label>
          <input type="text" id="album-title" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="f.eks. Invincible Shield">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Udgivelsesdato</label>
          <input type="date" id="album-date" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Genre</label>
          <input type="text" id="album-genre" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="f.eks. Heavy Metal">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Karakter (1 - 10)</label>
          <select id="album-rating" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed cursor-pointer">
            <option value="0">Ingen karakter endnu</option>
            <option value="1">1 / 10</option><option value="2">2 / 10</option><option value="3">3 / 10</option>
            <option value="4">4 / 10</option><option value="5">5 / 10</option><option value="6">6 / 10</option>
            <option value="7">7 / 10</option><option value="8">8 / 10</option><option value="9">9 / 10</option>
            <option value="10">10 / 10 - Mesterværk</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Album Cover URL</label>
          <input type="url" id="album-cover" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="https://..." oninput="updateCoverPreview(this.value)">
          <img id="modal-cover-preview" class="w-full h-40 sm:h-48 object-contain bg-black border border-metalBorder rounded-lg mt-3 hidden" alt="Forhåndsvisning" onerror="this.style.display='none'">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Spotify Link</label>
          <input type="url" id="album-spotify" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="https://open.spotify.com/album/...">
        </div>
        <div>
          <label class="block text-xs font-semibold text-neutral-400 mb-1">Kommentar / Anmeldelse</label>
          <textarea id="album-review" rows="3" class="w-full bg-[#0d0d0d] border border-metalBorder rounded-lg px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-neutral-200 focus:outline-none focus:border-metalRed" placeholder="Tanker om pladen..."></textarea>
        </div>
      </div>

      <div class="mt-5 sm:mt-6 flex flex-col sm:flex-row gap-3">
        <button id="modal-save-btn" onclick="saveAlbum()" class="flex-1 bg-metalRed hover:bg-red-700 text-white font-semibold py-2.5 sm:py-3 text-xs sm:text-sm rounded-lg transition-all shadow-md">💾 Gem Ændringer</button>
        <a id="modal-spotify-btn" href="#" target="_blank" style="display:none;" class="flex-1 bg-[#1DB954] hover:bg-[#1aa34a] text-black font-bold py-2.5 sm:py-3 text-xs sm:text-sm rounded-lg transition-all text-center flex items-center justify-center gap-2">🎧 Åbn i Spotify</a>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeCVcVM7W7nrXKePgb3FZe2DynG0hUE6yc6eMigxUNXu4FPqHS0wLb0RdgodbhVnA/exec';

    let library = [];
    let newsList = [];
    let activeSource = 'all';
    let currentSort = { column: 'artist', asc: true };
    let upcomingSort = { column: 'date', asc: true };
    let worklistSort = { column: 'artist', asc: true };
    let currentView = 'vault';
    let isAdmin = localStorage.getItem('metal_vault_admin') === 'true';

    const SOURCES = [
      { name: 'Heavymetal.dk', badgeColor: 'bg-red-950 text-red-400 border-red-900', url: 'https://heavymetal.dk/rss.xml' },
      { name: 'Metal Injection', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://metalinjection.net/feed' },
      { name: 'MetalSucks', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://www.metalsucks.net/feed/' },
      { name: 'Loudwire', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://loudwire.com/feed/' },
      { name: 'Decibel Magazine', badgeColor: 'bg-zinc-800 text-zinc-300 border-zinc-700', url: 'https://www.decibelmagazine.com/feed/' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      updateAdminUI();
      const cachedVault = localStorage.getItem('metal_vault_cache');
      if (cachedVault) {
        try { library = JSON.parse(cachedVault); } catch(e) {}
      }
      
      populateFilterDropdowns();
      renderApp();
      fetchAllData(library.length === 0);
      fetchAllNews(false);
    });

    function toggleAdminAuth() {
      if (isAdmin) {
        if (confirm('Vil du logge ud af admin-tilstand?')) {
          isAdmin = false;
          localStorage.setItem('metal_vault_admin', 'false');
          if (currentView === 'worklist') currentView = 'vault';
          updateAdminUI();
          renderApp();
        }
      } else {
        const pass = prompt('Indtast adgangskode for at redigere:');
        if (pass === 'metal123') {
          isAdmin = true;
          localStorage.setItem('metal_vault_admin', 'true');
          alert('Du er nu logget ind som Admin!');
          updateAdminUI();
          renderApp();
        } else if (pass !== null) {
          alert('Forkert adgangskode!');
        }
      }
    }

    function updateAdminUI() {
      const btn = document.getElementById('admin-auth-toggle');
      const addBtn = document.getElementById('add-album-btn');
      const syncBtn = document.getElementById('sync-btn');
      const worklistTab = document.getElementById('tab-worklist');
      
      if (isAdmin) {
        btn.innerText = '🔓 Ud';
        btn.classList.add('bg-emerald-950', 'text-emerald-400', 'border-emerald-900', 'px-2', 'py-1.5', 'text-[11px]');
        btn.classList.remove('px-2.5', 'py-2');
        if (addBtn) {
          addBtn.style.display = 'inline-flex';
          addBtn.className = 'bg-metalRed hover:bg-red-700 text-white px-2 py-1.5 rounded-lg text-[11px] font-semibold transition-all shadow-sm';
        }
        if (syncBtn) {
          syncBtn.style.display = 'inline-flex';
          syncBtn.className = 'bg-neutral-900 hover:bg-neutral-800 text-neutral-300 border border-metalBorder px-2 py-1.5 rounded-lg text-[11px] font-semibold transition-all';
        }
        if (worklistTab) worklistTab.style.display = 'inline-flex';
      } else {
        btn.innerText = '🔐 Admin';
        btn.classList.remove('bg-emerald-950', 'text-emerald-400', 'border-emerald-900', 'px-2', 'py-1.5', 'text-[11px]');
        btn.classList.add('px-2.5', 'py-2');
        if (addBtn) addBtn.style.display = 'none';
        if (syncBtn) syncBtn.style.display = 'none';
        if (worklistTab) worklistTab.style.display = 'none';
      }
      updateWorklistBadge();
    }

    function getMissingItems() {
      return library.filter(item => {
        if (isUpcoming(item.date)) return false;
        const rating = parseInt(item.rating) || 0;
        const hasNoCover = !item.cover || item.cover.trim() === '';
        const hasNoSpotify = !item.spotify || item.spotify.trim() === '';

        return !item.artist || !item.title || !item.date || !item.genre || rating === 0 || hasNoCover || hasNoSpotify;
      });
    }

    function updateWorklistBadge() {
      const badge = document.getElementById('worklist-badge-count');
      if (badge) {
        badge.innerHTML = `(${getMissingItems().length})`;
      }
    }

    function switchView(view) {
      if (view === 'worklist' && !isAdmin) return;
      currentView = view;
      document.getElementById('tab-vault').className = view === 'vault' ? 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all bg-metalRed text-white shadow-sm whitespace-nowrap' : 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap';
      document.getElementById('tab-upcoming').className = view === 'upcoming' ? 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all bg-metalRed text-white shadow-sm whitespace-nowrap' : 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap';
      
      const worklistTab = document.getElementById('tab-worklist');
      if (worklistTab) {
        worklistTab.className = view === 'worklist' ? 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all bg-amber-600 text-white shadow-sm whitespace-nowrap' : 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap';
      }

      document.getElementById('tab-news').className = view === 'news' ? 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all bg-metalRed text-white shadow-sm whitespace-nowrap' : 'px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-lg text-[11px] sm:text-xs font-semibold transition-all text-neutral-400 hover:text-white whitespace-nowrap';
      
      document.getElementById('filter-panel-container').style.display = (view === 'vault') ? 'flex' : 'none';
      document.getElementById('upcoming-filter-panel').style.display = (view === 'upcoming') ? 'flex' : 'none';

    async function fetchAllNews(isManualRefresh) {
      const refreshIcon = document.getElementById('refresh-icon');
      if (isManualRefresh && refreshIcon) refreshIcon.classList.add('animate-spin');

      let fetchedArticles = [];
      const fetchPromises = SOURCES.map(async (src) => {
        try {
          const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`;
          const response = await fetch(apiUrl);
          const data = await response.json();

          if (data && data.status === 'ok' && Array.isArray(data.items)) {
            return data.items.map(item => {
              let imageUrl = item.thumbnail || (item.enclosure ? item.enclosure.link : null);
              if (!imageUrl && item.content) {
                const imgMatch = item.content.match(/src="([^"]+)"/);
                if (imgMatch) imageUrl = imgMatch[1];
              }

              let cleanSnippet = item.description || item.content || '';
              cleanSnippet = cleanSnippet.replace(/<\/?[^>]+(>|$)/g, "");
              if (cleanSnippet.length > 180) {
                cleanSnippet = cleanSnippet.substring(0, 180) + '...';
              }

              return {
                title: item.title || 'Uden titel',
                link: item.link || '#',
                pubDate: item.pubDate || new Date().toISOString(),
                source: src.name,
                snippet: cleanSnippet || 'Ingen beskrivelse tilgængelig.',
                image: imageUrl || `https://placehold.co/600x400/141418/dc2626?text=${encodeURIComponent(src.name)}`
              };
            });
          }
        } catch (err) {
          console.warn(`Kunne ikke hente feed fra ${src.name}:`, err);
        }
        return [];
      });

      const results = await Promise.all(fetchPromises);
      results.forEach(articles => {
        if (articles && articles.length > 0) {
          fetchedArticles = fetchedArticles.concat(articles);
        }
      });

      if (fetchedArticles.length > 0) {
        fetchedArticles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));
        newsList = fetchedArticles;
      }

      if (isManualRefresh && refreshIcon) {
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 500);
      }

      if (currentView === 'news') {
        renderApp();
      }
    }

    function sendToSheet(paramsObj) {
      const queryParams = new URLSearchParams(paramsObj);
      queryParams.append('t', new Date().getTime());
      fetch(SCRIPT_URL + '?' + queryParams.toString(), { method: 'GET', mode: 'no-cors' })
        .then(() => {
          setTimeout(() => {
            localStorage.removeItem('metal_vault_cache');
            fetchAllData(false);
          }, 1500);
        })
        .catch(err => console.error('Synkroniseringsfejl:', err));
    }

    // Her lægger vi automatisk +1 dag til, så alle datoer vises korrekt på skærmen
    function addOneDay(dateString) {
      if (!dateString) return null;
      let dateStr = String(dateString).split('T')[0];
      const parts = dateStr.split('-');
      if (parts.length === 3) {
        const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
        if (!isNaN(d)) {
          d.setDate(d.getDate() + 1);
          return d;
        }
      }
      const fallback = new Date(dateString);
      if (isNaN(fallback)) return null;
      fallback.setDate(fallback.getDate() + 1);
      return fallback;
    }

    function isUpcoming(dateString) {
      if (!dateString) return false;
      const d = addOneDay(dateString);
      if (!d || isNaN(d)) return false;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return d > today;
    }

    function renderSkulls(rating, safeArtist, safeTitle) {
      const exactSkulls = rating / 2;
      let skullsHtml = '';
      for (let i = 1; i <= 5; i++) {
        let skullStyle = 'text-neutral-700';
        let opacityStyle = 'opacity-30';

        if (i <= Math.floor(exactSkulls)) {
          skullStyle = 'text-metalRed drop-shadow-[0_0_10px_rgba(220,38,38,0.8)]';
          opacityStyle = 'opacity-100 scale-110';
        } else if (i === Math.ceil(exactSkulls) && exactSkulls % 1 !== 0) {
          skullStyle = 'text-metalRed';
          opacityStyle = 'opacity-60 scale-105';
        }

        if (isAdmin) {
          const targetRatingVal = i * 2;
          skullsHtml += `<button onclick="updateRatingDirect('${safeArtist}', '${safeTitle}', ${targetRatingVal}, event)" title="Sæt karakter til ${targetRatingVal}/10" class="transition-all hover:scale-125 ${skullStyle} ${opacityStyle} text-base sm:text-lg">💀</button>`;
        } else {
          skullsHtml += `<span class="transition-all ${skullStyle} ${opacityStyle} text-base sm:text-lg">💀</span>`;
        }
      }
      return skullsHtml;
    }

                <h3 class="font-cinzel text-base font-bold text-white leading-snug mb-3 hover:text-metalRed transition-colors">
                  <a href="${article.link}" target="_blank" rel="noopener noreferrer">${article.title}</a>
                </h3>
                <p class="text-xs text-neutral-300 line-clamp-3 leading-relaxed">${article.snippet}</p>
              </div>
            </div>
            <div class="p-5 pt-0">
              <a href="${article.link}" target="_blank" rel="noopener noreferrer" class="block w-full bg-neutral-900 hover:bg-neutral-800 text-neutral-200 border border-metalBorder py-2.5 rounded-lg text-xs font-semibold text-center transition-all">Læs hele artiklen ➔</a>
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
    }
  </script>
</body>
</html>
