<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Vault - Album & Band Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #141418;
      --bg-hover: #1c1c22;
      --accent: #e50914;
      --accent-hover: #ff1e27;
      --accent-glow: rgba(229, 9, 20, 0.4);
      --text-main: #f0f0f2;
      --text-muted: #8a8a9e;
      --border: #262630;
      --gold: #ffb703;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(180deg, rgba(20,20,24,0.95) 0%, rgba(10,10,12,0.95) 100%);
      border-bottom: 2px solid var(--accent);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: uppercase;
    }

    .logo span { color: var(--accent); }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(0,0,0,0.5);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border-radius: calc(var(--radius) - 2px);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .nav-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 0.6rem 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-action:hover { background: #334155; border-color: #38bdf8; }

    .btn-danger {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #f87171;
    }
    .btn-danger:hover { background: #7f1d1d; color: #fff; }

    .btn-primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    main { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none; justify-content: center; align-items: center; z-index: 1000;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 90%; max-width: 550px;
      padding: 2rem;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { font-family: 'Cinzel', serif; margin-bottom: 1rem; color: var(--accent); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group textarea, .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }

    .filter-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .filter-row {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-input {
      flex: 2;
      min-width: 220px;
      padding: 0.65rem 1rem;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
    }

    .filter-select {
      flex: 1;
      min-width: 140px;
      padding: 0.65rem 0.8rem;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .filter-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-right: 0.3rem;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .vault-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.9rem;
    }

    .vault-table th, .vault-table td {
      padding: 0.8rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    .vault-table th {
      background: #181820;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .clickable-row { transition: background-color 0.2s; }
    .clickable-row:hover { background-color: var(--bg-hover); }

    .album-thumb {
      width: 40px;
      height: 40px;
      border-radius: 4px;
      object-fit: cover;
      background-color: #222;
      border: 1px solid var(--border);
    }

    .loading-msg, .error-msg {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">🤘 Metal <span>Vault</span></div>
      
      <div class="nav-tabs">
        <button class="tab-btn active" id="tab-albums" onclick="switchTab('albums')">📁 Album Bibliotek</button>
      </div>

      <div class="nav-actions">
        <button class="btn-action btn-primary" onclick="openAddModal()">➕ Tilføj Album</button>
        <button class="btn-action" onclick="fetchDataFromSheet()">🔄 Synkroniser nu</button>
      </div>
    </div>
  </header>

  <main>
    <div class="filter-panel">
      <div class="filter-row">
        <input type="text" id="search-bar" class="search-input" placeholder="🔍 Søg efter band, album, genre..." oninput="renderApp()">
        <button class="reset-btn" onclick="resetFilters()">↺ Nulstil filtre</button>
      </div>
    </div>

    <div id="content-container">
      <div class="loading-msg">Henter data fra Google Sheets...</div>
    </div>
  </main>

  <!-- MODAL: ALBUM -->
  <div class="modal-overlay" id="album-modal" onclick="closeModal('album-modal')">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 id="album-modal-title">Tilføj Album</h2>
      <input type="hidden" id="album-edit-id">

      <div class="form-group">
        <label>Band</label>
        <input type="text" id="album-artist" placeholder="f.eks. Judas Priest">
      </div>
      <div class="form-group">
        <label>Albumtitel</label>
        <input type="text" id="album-title" placeholder="f.eks. Invincible Shield">
      </div>
      <div class="form-group">
        <label>Udgivelsesdato</label>
        <input type="date" id="album-date">
      </div>
      <div class="form-group">
        <label>Genre</label>
        <input type="text" id="album-genre" placeholder="f.eks. Heavy Metal">
      </div>
      <div class="form-group">
        <label>Karakter (1 - 10)</label>
        <select id="album-rating">
          <option value="0">Ingen karakter endnu</option>
          <option value="1">1 / 10</option><option value="2">2 / 10</option><option value="3">3 / 10</option>
          <option value="4">4 / 10</option><option value="5">5 / 10</option><option value="6">6 / 10</option>
          <option value="7">7 / 10</option><option value="8">8 / 10</option><option value="9">9 / 10</option>
          <option value="10">10 / 10 - Mesterværk</option>
        </select>
      </div>
      <div class="form-group">
        <label>Kommentar</label>
        <textarea id="album-review" rows="3" placeholder="Skriv dine tanker her..."></textarea>
      </div>

      <button class="btn" onclick="saveAlbum()">💾 Gem Album</button>
      <button class="btn" style="background:#333; margin-left:0.5rem;" onclick="closeModal('album-modal')">Luk</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOLCvyvOxPTYkbO922s4FF640UrYGYssSwzicRd-iYE5NiQJycmAzQaP0S_MPjGprS/exec';

    let library = [];

    window.addEventListener('DOMContentLoaded', () => {
      fetchDataFromSheet();
    });

    function fetchDataFromSheet() {
      const container = document.getElementById('content-container');
      container.innerHTML = `<div class="loading-msg">Henter data fra Google Sheets...</div>`;

      // Tilføj et tilfældigt 'cache-buster' parameter for at undgå at browseren gemmer gamle svar
      const url = SCRIPT_URL + '?t=' + new Date().getTime();

      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error('Netværksfejl ved hentning af data');
          return res.json();
        })
        .then(data => {
          if (Array.isArray(data)) {
            library = data;
            renderApp();
          } else {
            container.innerHTML = `<div class="error-msg">Modtog ikke gyldig data fra Google Sheets (forkert format).</div>`;
          }
        })
        .catch(err => {
          console.error('Fejl:', err);
          container.innerHTML = `<div class="error-msg">Kunne ikke hente data. Tjek at dit Apps Script er udrullet korrekt med adgang for "Alle".<br><small>${err.message}</small></div>`;
        });
    }

    function sendToSheet(action, itemData) {
      const payload = { action: action, item: itemData };
      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        setTimeout(fetchDataFromSheet, 1200); // Genindlæs data efter et øjeblik
      }).catch(err => console.error('Synkroniseringsfejl:', err));
    }

    function openAddModal() {
      document.getElementById('album-modal').classList.add('active');
      document.getElementById('album-modal-title').innerText = 'Tilføj Album';
      document.getElementById('album-edit-id').value = '';
      document.getElementById('album-artist').value = '';
      document.getElementById('album-title').value = '';
      document.getElementById('album-date').value = '';
      document.getElementById('album-genre').value = '';
      document.getElementById('album-rating').value = 0;
      document.getElementById('album-review').value = '';
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    function resetFilters() {
      document.getElementById('search-bar').value = '';
      renderApp();
    }

    function saveAlbum() {
      const idInput = document.getElementById('album-edit-id').value;
      const itemData = {
        id: idInput ? parseInt(idInput) : Date.now(),
        artist: document.getElementById('album-artist').value,
        title: document.getElementById('album-title').value,
        date: document.getElementById('album-date').value,
        genre: document.getElementById('album-genre').value,
        rating: parseInt(document.getElementById('album-rating').value) || 0,
        review: document.getElementById('album-review').value
      };

      const action = idInput ? 'update' : 'add';
      sendToSheet(action, itemData);
      closeModal('album-modal');
    }

    function renderApp() {
      const container = document.getElementById('content-container');
      const searchTerm = document.getElementById('search-bar')?.value.toLowerCase() || '';

      let filtered = library.filter(item => {
        return Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm));
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="loading-msg">Ingen albums fundet eller arket er tomt.</div>`;
        return;
      }

      container.innerHTML = `
        <div class="table-container">
          <table class="vault-table">
            <thead>
              <tr>
                <th style="width: 60px;">Cover</th>
                <th>Band</th>
                <th>Albumtitel</th>
                <th>Dato</th>
                <th>Genre</th>
                <th style="width: 100px;">Karakter</th>
              </tr>
            </thead>
            <tbody>
              ${filtered.map(item => `
                <tr class="clickable-row">
                  <td><img src="https://picsum.photos/seed/${encodeURIComponent((item.artist||'')+(item.title||''))}/40/40" class="album-thumb"></td>
                  <td>${item.artist || ''}</td>
                  <td style="font-weight:600;">${item.title || ''}</td>
                  <td>${item.date || ''}</td>
                  <td>${item.genre || ''}</td>
                  <td>⭐ ${item.rating || 0}/10</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }
  </script>
</body>
</html>
