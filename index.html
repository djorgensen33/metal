<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metal Vault - Album & Band Database</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-card: #141418;
      --bg-hover: #1c1c22;
      --accent: #e50914;
      --accent-hover: #ff1e27;
      --accent-glow: rgba(229, 9, 20, 0.5);
      --text-main: #f0f0f2;
      --text-muted: #8a8a9e;
      --border: #262630;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      padding-bottom: 50px;
    }

    header {
      background: linear-gradient(180deg, rgba(20,20,24,0.95) 0%, rgba(10,10,12,0.95) 100%);
      border-bottom: 2px solid var(--accent);
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(10px);
    }

    .nav-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); text-shadow: 0 0 10px var(--accent-glow); }

    .view-tabs {
      display: flex;
      gap: 0.5rem;
      background: #09090b;
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #fff;
    }
    .tab-btn:hover:not(.active) { color: var(--text-main); background: rgba(255,255,255,0.05); }

    .nav-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center; }

    .btn-action {
      background: #1e293b;
      border: 1px solid #334155;
      color: #38bdf8;
      padding: 0.6rem 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-action:hover { background: #334155; border-color: #38bdf8; }

    .btn-danger {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #f87171;
    }
    .btn-danger:hover { background: #7f1d1d; color: #fff; }

    .btn-primary {
      background: var(--accent);
      border: 1px solid var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }

    .admin-auth-btn {
      background: #181820;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.2s;
    }
    .admin-auth-btn.logged-in {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    main { max-width: 1400px; margin: 2rem auto; padding: 0 1.5rem; }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: none; justify-content: center; align-items: center; z-index: 1000;
      backdrop-filter: blur(5px);
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 90%; max-width: 550px;
      padding: 2rem;
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal h2 { font-family: 'Cinzel', serif; margin-bottom: 1rem; color: var(--accent); }

    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 600; }
    .form-group textarea, .form-group input, .form-group select {
      width: 100%;
      padding: 0.75rem;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--accent); }

    .modal-cover-preview {
      width: 100%;
      max-height: 320px;
      border-radius: var(--radius);
      object-fit: contain;
      border: 1px solid var(--border);
      background: #000;
      margin-top: 0.8rem;
      display: block;
    }

    .filter-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .search-input {
      flex: 2;
      min-width: 220px;
      padding: 0.65rem 1rem;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
    }
    .filter-select {
      flex: 1;
      min-width: 150px;
      padding: 0.65rem 1rem;
      background: #09090b;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text-main);
      cursor: pointer;
    }
    .reset-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.65rem 1rem;
      font-size: 0.85rem;
      border-radius: var(--radius);
      cursor: pointer;
    }
    .reset-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }

    .table-container {
      width: 100%;
      overflow-x: auto;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .vault-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.95rem;
    }
    .vault-table th, .vault-table td {
      padding: 1.1rem 1rem;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    .vault-table th {
      background: #181820;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      user-select: none;
    }
    
    .th-content {
      cursor: pointer;
      display: inline-block;
    }
    .th-content:hover { color: var(--text-main); }
    .vault-table th span { font-size: 0.7rem; margin-left: 4px; color: var(--accent); }

    .clickable-row { transition: background-color 0.2s; cursor: pointer; }
    .clickable-row:hover { background-color: var(--bg-hover); }

    .row-missing-rating {
      background-color: rgba(229, 9, 20, 0.12) !important;
    }
    .row-missing-rating:hover {
      background-color: rgba(229, 9, 20, 0.2) !important;
    }

    .inline-edit-input {
      width: 100%;
      background: #09090b;
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    .countdown-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.4);
      color: #ff6b72;
      padding: 0.3rem 0.7rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .countdown-badge.today {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #34d399;
    }

    .metal-rating-container {
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      position: relative;
    }
    .metal-skull {
      font-size: 1.1rem;
      filter: grayscale(100%) brightness(35%);
      transition: transform 0.2s ease;
      display: inline-block;
    }
    .metal-skull.active {
      filter: grayscale(0%) brightness(110%);
      text-shadow: 0 0 8px var(--accent);
    }
    .metal-skull.half {
      background: linear-gradient(90deg, var(--accent) 50%, #444 50%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 5px var(--accent));
    }
    .metal-rating-container:hover .metal-skull { transform: scale(1.15); }

    .rating-text-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-left: 8px;
      font-weight: 600;
    }

    .rating-popup {
      display: none;
      position: absolute;
      left: 0; bottom: 130%;
      background: #181820;
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 6px 10px;
      z-index: 50;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      white-space: nowrap;
      align-items: center;
      gap: 5px;
    }
    .metal-rating-container:hover .rating-popup,
    .rating-popup.active { display: flex; }

    .popup-skull-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      filter: grayscale(100%) brightness(50%);
      transition: transform 0.1s, filter 0.1s;
      padding: 2px;
    }
    .popup-skull-btn:hover {
      filter: grayscale(0%) brightness(120%);
      transform: scale(1.3);
    }

    .loading-msg, .error-msg {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .error-msg { color: #f87171; }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <div class="logo">🤘 Metal <span>Vault</span></div>
      
      <div class="view-tabs">
        <button class="tab-btn active" id="tab-vault" onclick="switchView('vault')">🗄️ Hoveddatabase</button>
        <button class="tab-btn" id="tab-upcoming" onclick="switchView('upcoming')">🚀 Upcoming Releases</button>
      </div>

      <div class="nav-actions">
        <button class="btn-action btn-danger" id="delete-selected-btn" style="display:none;" onclick="deleteSelectedAlbums()">🗑 Slet valgte (<span id="selected-count">0</span>)</button>
        <button class="btn-action btn-primary" id="add-album-btn" style="display:none;" onclick="openAddModal()">➕ Tilføj Album</button>
        <button class="btn-action" id="sync-btn" style="display:none;" onclick="fetchDataFromSheet(true)">🔄 Synkroniser</button>
        <button class="admin-auth-btn" id="admin-auth-toggle" onclick="toggleAdminAuth()">🔐 Admin Login</button>
      </div>
    </div>
  </header>

  <main>
    <div class="filter-panel" id="filter-panel-container">
      <input type="text" id="search-bar" class="search-input" placeholder="🔍 Søg efter band, album, anmeldelse..." oninput="renderApp()">
      <select id="genre-filter" class="filter-select" onchange="renderApp()">
        <option value="">Alle genrer</option>
      </select>
      <select id="year-filter" class="filter-select" onchange="renderApp()">
        <option value="">Alle årstal</option>
      </select>
      <select id="rating-filter" class="filter-select" onchange="renderApp()">
        <option value="">Alle karakterer</option>
        <option value="missing">Mangler karakter (0)</option>
      </select>
      <button class="reset-btn" onclick="resetFilters()">↺ Nulstil</button>
    </div>

    <div id="content-container">
      <div class="loading-msg">Indlæser Metal Vault...</div>
    </div>
  </main>

  <div class="modal-overlay" id="album-modal" onclick="closeModal('album-modal')">
    <div class="modal" onclick="event.stopPropagation()">
      <h2 id="album-modal-title">Tilføj Album</h2>
      <input type="hidden" id="album-edit-id">

      <div class="form-group">
        <label>Band / Artist</label>
        <input type="text" id="album-artist" placeholder="f.eks. Judas Priest">
      </div>
      <div class="form-group">
        <label>Albumtitel</label>
        <input type="text" id="album-title" placeholder="f.eks. Invincible Shield">
      </div>
      <div class="form-group">
        <label>Udgivelsesdato</label>
        <input type="date" id="album-date">
      </div>
      <div class="form-group">
        <label>Genre</label>
        <input type="text" id="album-genre" placeholder="f.eks. Heavy Metal">
      </div>
      <div class="form-group">
        <label>Karakter (1 - 10)</label>
        <select id="album-rating">
          <option value="0">Ingen karakter endnu</option>
          <option value="1">1 / 10</option><option value="2">2 / 10</option><option value="3">3 / 10</option>
          <option value="4">4 / 10</option><option value="5">5 / 10</option><option value="6">6 / 10</option>
          <option value="7">7 / 10</option><option value="8">8 / 10</option><option value="9">9 / 10</option>
          <option value="10">10 / 10 - Mesterværk</option>
        </select>
      </div>
      <div class="form-group">
        <label>Album Cover</label>
        <input type="url" id="album-cover" placeholder="https://..." oninput="updateCoverPreview(this.value)">
        <img id="modal-cover-preview" class="modal-cover-preview" src="" alt="Cover Forhåndsvisning" onerror="this.style.display='none'">
      </div>
      <div class="form-group">
        <label>Spotify Link</label>
        <input type="url" id="album-spotify" placeholder="https://open.spotify.com/album/...">
      </div>
      <div class="form-group">
        <label>Kommentar / Anmeldelse</label>
        <textarea id="album-review" rows="3" placeholder="Tanker..."></textarea>
      </div>

      <button class="btn-action btn-primary" style="width:100%; justify-content:center; padding: 0.75rem;" onclick="saveAlbum()">💾 Gem Ændringer</button>
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeCVcVM7W7nrXKePgb3FZe2DynG0hUE6yc6eMigxUNXu4FPqHS0wLb0RdgodbhVnA/exec';

    let library = [];
    let currentSort = { column: 'artist', asc: true };
    let currentView = 'vault';
    let isAdmin = localStorage.getItem('metal_vault_admin') === 'true';

    window.addEventListener('DOMContentLoaded', () => {
      updateAdminUI();
      const cached = localStorage.getItem('metal_vault_cache');
      if (cached) {
        try {
          library = JSON.parse(cached);
          populateFilterDropdowns();
          renderApp();
        } catch(e) {}
      }
      fetchDataFromSheet(library.length === 0);
    });

    function toggleAdminAuth() {
      if (isAdmin) {
        if (confirm('Vil du logge ud af admin-tilstand?')) {
          isAdmin = false;
          localStorage.setItem('metal_vault_admin', 'false');
          updateAdminUI();
          renderApp();
        }
      } else {
        const pass = prompt('Indtast adgangskode for at redigere:');
        if (pass === 'metal123') {
          isAdmin = true;
          localStorage.setItem('metal_vault_admin', 'true');
          alert('Du er nu logget ind som Admin!');
          updateAdminUI();
          renderApp();
        } else if (pass !== null) {
          alert('Forkert adgangskode!');
        }
      }
    }

    function updateAdminUI() {
      const btn = document.getElementById('admin-auth-toggle');
      const addBtn = document.getElementById('add-album-btn');
      const syncBtn = document.getElementById('sync-btn');
      
      if (isAdmin) {
        btn.innerText = '🔓 Log ud (Admin)';
        btn.classList.add('logged-in');
        if (addBtn) addBtn.style.display = 'inline-flex';
        if (syncBtn) syncBtn.style.display = 'inline-flex';
      } else {
        btn.innerText = '🔐 Admin Login';
        btn.classList.remove('logged-in');
        if (addBtn) addBtn.style.display = 'none';
        if (syncBtn) syncBtn.style.display = 'none';
      }
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('tab-vault').classList.toggle('active', view === 'vault');
      document.getElementById('tab-upcoming').classList.toggle('active', view === 'upcoming');
      
      const filterPanel = document.getElementById('filter-panel-container');
      if (filterPanel) filterPanel.style.display = (view === 'vault') ? 'flex' : 'none';
      
      renderApp();
    }

    function fetchDataFromSheet(showLoadingMsg) {
      const container = document.getElementById('content-container');
      if (showLoadingMsg && library.length === 0 && container) {
        container.innerHTML = '<div class="loading-msg">Henter data fra Google Sheets...</div>';
      }

      fetch(SCRIPT_URL + '?t=' + new Date().getTime())
        .then(res => res.json())
        .then(data => {
          if (Array.isArray(data)) {
            library = data;
            localStorage.setItem('metal_vault_cache', JSON.stringify(library));
            populateFilterDropdowns();
            renderApp();
          } else {
            if (library.length === 0 && container) {
              container.innerHTML = '<div class="error-msg">Ugyldig data modtaget fra serveren.</div>';
            }
          }
        })
        .catch(err => {
          console.error('Fejl ved hentning:', err);
          if (library.length === 0 && container) {
            container.innerHTML = '<div class="error-msg">Kunne ikke hente data.<br><br><button class="btn-action btn-primary" onclick="fetchDataFromSheet(true)">Prøv igen</button></div>';
          }
        });
    }

    function sendToSheet(paramsObj) {
      const queryParams = new URLSearchParams(paramsObj);
      queryParams.append('t', new Date().getTime());
      const url = SCRIPT_URL + '?' + queryParams.toString();

      fetch(url, { method: 'GET', mode: 'no-cors' })
        .then(() => {
          setTimeout(() => {
            localStorage.removeItem('metal_vault_cache');
            fetchDataFromSheet(false);
          }, 1500);
        })
        .catch(err => console.error('Synkroniseringsfejl:', err));
    }

    function populateFilterDropdowns() {
      const genreSelect = document.getElementById('genre-filter');
      const yearSelect = document.getElementById('year-filter');
      if (!genreSelect || !yearSelect) return;
      
      const currentGenre = genreSelect.value;
      const currentYear = yearSelect.value;

      const genres = [...new Set(library.map(i => String(i.genre || '').trim()).filter(Boolean))].sort();
      const years = [...new Set(library.map(i => {
        if (!i.date) return '';
        const d = addOneDay(i.date);
        return d && !isNaN(d) ? d.getFullYear() : '';
      }).filter(Boolean))].sort((a, b) => b - a);

      genreSelect.innerHTML = '<option value="">Alle genrer</option>' + genres.map(g => '<option value="' + g + '">' + g + '</option>').join('');
      yearSelect.innerHTML = '<option value="">Alle årstal</option>' + years.map(y => '<option value="' + y + '">' + y + '</option>').join('');

      genreSelect.value = currentGenre;
      yearSelect.value = currentYear;
    }

    function updateCoverPreview(url) {
      const preview = document.getElementById('modal-cover-preview');
      if (!preview) return;
      if (url && url.trim() !== '') {
        preview.src = url;
        preview.style.display = 'block';
      } else {
        preview.style.display = 'none';
      }
    }

    function openAddModal() {
      if (!isAdmin) return;
      document.getElementById('album-modal').classList.add('active');
      document.getElementById('album-modal-title').innerText = 'Tilføj Nyt Album';
      document.getElementById('album-edit-id').value = '';
      document.getElementById('album-artist').value = '';
      document.getElementById('album-title').value = '';
      document.getElementById('album-date').value = '';
      document.getElementById('album-genre').value = '';
      document.getElementById('album-rating').value = 0;
      document.getElementById('album-cover').value = '';
      document.getElementById('album-spotify').value = '';
      document.getElementById('album-review').value = '';
      updateCoverPreview('');
    }

    function openEditModal(id) {
      if (!isAdmin) return;
      const item = library.find(i => String(i.id) === String(id));
      if (!item) return;

      document.getElementById('album-modal').classList.add('active');
      document.getElementById('album-modal-title').innerText = 'Rediger Album';
      document.getElementById('album-edit-id').value = item.id;
      document.getElementById('album-artist').value = item.artist || '';
      document.getElementById('album-title').value = item.title || '';
      document.getElementById('album-date').value = item.date ? String(item.date).split('T')[0] : '';
      document.getElementById('album-genre').value = item.genre || '';
      document.getElementById('album-rating').value = item.rating || 0;
      document.getElementById('album-cover').value = item.cover || '';
      document.getElementById('album-spotify').value = item.spotify || '';
      document.getElementById('album-review').value = item.review || '';
      updateCoverPreview(item.cover || '');
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.remove('active');
    }

    function saveAlbum() {
      const itemData = {
        artist: document.getElementById('album-artist').value,
        title: document.getElementById('album-title').value,
        date: document.getElementById('album-date').value,
        genre: document.getElementById('album-genre').value,
        rating: parseInt(document.getElementById('album-rating').value) || 0,
        cover: document.getElementById('album-cover').value,
        spotify: document.getElementById('album-spotify').value,
        review: document.getElementById('album-review').value
      };
      
      const idx = library.findIndex(i => (i.artist||'').trim().toLowerCase() === itemData.artist.trim().toLowerCase() && (i.title||'').trim().toLowerCase() === itemData.title.trim().toLowerCase());
      if (idx !== -1) {
        library[idx] = Object.assign({}, library[idx], itemData);
      } else {
        library.push(itemData);
      }
      localStorage.setItem('metal_vault_cache', JSON.stringify(library));
      populateFilterDropdowns();
      renderApp();

      sendToSheet(Object.assign({ action: 'save' }, itemData));
      closeModal('album-modal');
    }

    function updateRatingDirect(id, newRating, event) {
      if (event) event.stopPropagation();
      if (!isAdmin) return;
      const item = library.find(i => String(i.id) === String(id));
      if (!item) return;
      
      item.rating = parseInt(newRating) || 0;
      localStorage.setItem('metal_vault_cache', JSON.stringify(library));
      renderApp();
      
      sendToSheet({
        action: 'updaterating',
        artist: item.artist || '',
        title: item.title || '',
        rating: item.rating
      });
    }

    function makeEditable(cellElement, id, field) {
      if (!isAdmin) return;
      if (cellElement.querySelector('input')) return;

      const item = library.find(i => String(i.id) === String(id));
      if (!item) return;

      const currentValue = field === 'date' ? (item[field] ? String(item[field]).split('T')[0] : '') : (item[field] || '');
      const inputType = field === 'date' ? 'date' : 'text';

      cellElement.innerHTML = '<input type="' + inputType + '" class="inline-edit-input" value="' + currentValue.replace(/"/g, '&quot;') + '" onclick="event.stopPropagation()">';
      const input = cellElement.querySelector('input');
      input.focus();

      const saveChanges = () => {
        const newVal = input.value;
        if (newVal !== currentValue) {
          item[field] = newVal;
          localStorage.setItem('metal_vault_cache', JSON.stringify(library));
          populateFilterDropdowns();
          renderApp();

          sendToSheet({
            action: 'save',
            artist: item.artist || '',
            title: item.title || '',
            date: item.date || '',
            genre: item.genre || '',
            rating: item.rating || 0,
            cover: item.cover || '',
            spotify: item.spotify || '',
            review: item.review || ''
          });
        } else {
          renderApp();
        }
      };

      input.addEventListener('blur', saveChanges);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          saveChanges();
        } else if (e.key === 'Escape') {
          renderApp();
        }
      });
    }

    function resetFilters() {
      const searchBar = document.getElementById('search-bar');
      const genreFilter = document.getElementById('genre-filter');
      const yearFilter = document.getElementById('year-filter');
      const ratingFilter = document.getElementById('rating-filter');
      if (searchBar) searchBar.value = '';
      if (genreFilter) genreFilter.value = '';
      if (yearFilter) yearFilter.value = '';
      if (ratingFilter) ratingFilter.value = '';
      renderApp();
    }

    function sortTable(column) {
      if (currentSort.column === column) {
        currentSort.asc = !currentSort.asc;
      } else {
        currentSort.column = column;
        currentSort.asc = true;
      }
      renderApp();
    }

    function toggleSelectAll(master) {
      const checkboxes = document.querySelectorAll('.row-checkbox');
      checkboxes.forEach(cb => cb.checked = master.checked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const checked = document.querySelectorAll('.row-checkbox:checked');
      const countSpan = document.getElementById('selected-count');
      const deleteBtn = document.getElementById('delete-selected-btn');
      if (countSpan && deleteBtn) {
        countSpan.innerText = checked.length;
        deleteBtn.style.display = (isAdmin && checked.length > 0) ? 'inline-flex' : 'none';
      }
    }

    function deleteSelectedAlbums() {
      if (!isAdmin) return;
      const checked = document.querySelectorAll('.row-checkbox:checked');
      if (checked.length === 0) return;

      if (!confirm('Er du sikker på, at du vil slette ' + checked.length + ' album(s)?')) return;

      const idsToDelete = Array.from(checked).map(cb => {
        const id = cb.value;
        const item = library.find(i => String(i.id) === String(id));
        if (item) {
          const artist = (item.artist || '').trim().toLowerCase();
          const title = (item.title || '').trim().toLowerCase();
          return artist + "___" + title;
        }
        return "";
      }).filter(Boolean);
      
      library = library.filter((i, idx) => !Array.from(checked).some(cb => String(cb.value) === String(i.id || "row_" + (idx+1))));
      localStorage.setItem('metal_vault_cache', JSON.stringify(library));
      populateFilterDropdowns();
      renderApp();

      sendToSheet({
        action: 'delete',
        ids: idsToDelete.join(',')
      });
    }

    function addOneDay(dateString) {
      if (!dateString) return null;
      const clean = String(dateString).split('T')[0];
      const parts = clean.split('-');
      if (parts.length !== 3) return new Date(dateString);
      
      const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
      d.setDate(d.getDate() + 1);
      return d;
    }

    function formatDateDK(dateString) {
      if (!dateString) return '';
      const d = addOneDay(dateString);
      if (!d || isNaN(d)) return dateString;
      
      const day = String(d.getDate()).padStart(2, '0');
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const year = d.getFullYear();
      return day + '-' + month + '-' + year;
    }

    function parseLocalDate(dateString) {
      return addOneDay(dateString);
    }

    function getDaysUntil(dateString) {
      if (!dateString) return null;
      const today = new Date();
      today.setHours(0,0,0,0);
      const target = parseLocalDate(dateString);
      if (!target) return null;
      target.setHours(0,0,0,0);
      const diffTime = target - today;
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    }

    function renderSkulls(rating, rowId) {
      const r = parseInt(rating) || 0;
      let html = '<div class="metal-rating-container" title="' + r + '/10 karakter">';
      
      for (let i = 1; i <= 5; i++) {
        const skullVal = i * 2;
        if (r >= skullVal) {
          html += '<span class="metal-skull active">💀</span>';
        } else if (r === skullVal - 1) {
          html += '<span class="metal-skull half">💀</span>';
        } else {
          html += '<span class="metal-skull">💀</span>';
        }
      }

      if (r > 0) {
        html += '<span class="rating-text-label">' + r + '/10</span>';
      } else {
        html += '<span class="rating-text-label" style="opacity:0.4;">-</span>';
      }

      if (isAdmin) {
        html += '<div class="rating-popup" onclick="event.stopPropagation()">';
        for (let score = 1; score <= 10; score++) {
          html += '<button class="popup-skull-btn" onclick="updateRatingDirect(\'' + rowId + '\', ' + score + ', event)" title="' + score + '/10">💀</button>';
        }
        html += '</div>';
      }

      html += '</div>';
      return html;
    }

    function renderUpcomingView(container) {
      const today = new Date();
      today.setHours(0,0,0,0);

      const searchTerm = document.getElementById('upcoming-search-bar')?.value.toLowerCase() || '';

      const upcoming = library.filter(item => {
        if (!item.date) return false;
        const target = parseLocalDate(item.date);
        if (!target) return false;
        target.setHours(0,0,0,0);
        if (target < today) return false;

        return Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm));
      }).sort((a, b) => parseLocalDate(a.date) - parseLocalDate(b.date));

      const getArrow = (col) => currentSort.column === col ? (currentSort.asc ? '▲' : '▼') : '';

      container.innerHTML = '<div class="filter-panel">' +
        '<input type="text" id="upcoming-search-bar" class="search-input" placeholder="🔍 Søg i upcoming..." value="' + searchTerm + '" oninput="renderUpcomingView(document.getElementById(\'content-container\'))">' +
      '</div>';

      if (upcoming.length === 0) {
        container.innerHTML += '<div class="loading-msg">Ingen upcoming releases fundet, der matcher dine filtre.</div>';
        updateSelectedCount();
        return;
      }

      container.innerHTML += '<div class="table-container">' +
        '<table class="vault-table">' +
          '<thead>' +
            '<tr>' +
              '<th style="width: 45px;"><input type="checkbox" onclick="toggleSelectAll(this)"></th>' +
              '<th><div class="th-content" onclick="sortTable(\'artist\')">Band <span>' + getArrow('artist') + '</span></div></th>' +
              '<th><div class="th-content" onclick="sortTable(\'title\')">Albumtitel <span>' + getArrow('title') + '</span></div></th>' +
              '<th style="width: 150px;"><div class="th-content" onclick="sortTable(\'date\')">Udgivelsesdato <span>' + getArrow('date') + '</span></div></th>' +
              '<th style="width: 170px;"><div class="th-content" onclick="sortTable(\'genre\')">Genre <span>' + getArrow('genre') + '</span></div></th>' +
              '<th style="width: 180px;">Status</th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            upcoming.map((item, idx) => {
              const days = getDaysUntil(item.date);
              const formattedDate = formatDateDK(item.date);
              const rowId = item.id || ("row_" + (idx+1));
              const rowClass = isAdmin ? 'clickable-row' : '';
              
              let badgeHtml = '';
              if (days === 0) {
                badgeHtml = '<div class="countdown-badge today">🔥 I DAG!</div>';
              } else if (days === 1) {
                badgeHtml = '<div class="countdown-badge">⏳ I morgen</div>';
              } else if (days > 1) {
                badgeHtml = '<div class="countdown-badge">⏳ Om ' + days + ' dage</div>';
              }

              return '<tr class="' + rowClass + '" ' + (isAdmin ? 'onclick="openEditModal(\'' + rowId + '\')"' : '') + '>' +
                '<td onclick="event.stopPropagation()"><input type="checkbox" class="row-checkbox" value="' + rowId + '" onchange="updateSelectedCount()"></td>' +
                '<td ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'artist\'); event.stopPropagation();"' : '') + '>' + (item.artist || '') + '</td>' +
                '<td style="font-weight:600;" ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'title\'); event.stopPropagation();"' : '') + '>' +
                  '<div style="display: flex; align-items: center; gap: 10px;">' +
                    (item.cover ? '<img src="' + item.cover + '" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;" onerror="this.style.display=\'none\'">' : '') +
                    '<span>' + (item.title || '') + '</span>' +
                    (item.spotify ? '<a href="' + item.spotify + '" target="_blank" onclick="event.stopPropagation()" title="Åbn i Spotify" style="color: #1DB954; font-size: 1.2rem; text-decoration: none; margin-left: auto; flex-shrink: 0;">🟢</a>' : '') +
                  '</div>' +
                '</td>' +
                '<td ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'date\'); event.stopPropagation();"' : '') + '>' + formattedDate + '</td>' +
                '<td ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'genre\'); event.stopPropagation();"' : '') + '>' + (item.genre || '') + '</td>' +
                '<td>' + badgeHtml + '</td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div>';
      
      updateSelectedCount();
    }

    function renderApp() {
      const container = document.getElementById('content-container');
      if (!container) return;

      if (currentView === 'upcoming') {
        renderUpcomingView(container);
        return;
      }

      const today = new Date();
      today.setHours(0,0,0,0);

      const searchTerm = document.getElementById('search-bar')?.value.toLowerCase() || '';
      const selectedGenre = document.getElementById('genre-filter')?.value || '';
      const selectedYear = document.getElementById('year-filter')?.value || '';
      const selectedRatingFilter = document.getElementById('rating-filter')?.value || '';

      let filtered = library.filter(item => {
        if (item.date) {
          const target = parseLocalDate(item.date);
          if (target) {
            target.setHours(0,0,0,0);
            if (target > today) return false;
          }
        }

        const matchesSearch = Object.values(item).some(val => String(val).toLowerCase().includes(searchTerm));
        const matchesGenre = !selectedGenre || String(item.genre || '').trim().toLowerCase() === selectedGenre.toLowerCase();
        
        let matchesYear = true;
        if (selectedYear) {
          const d = addOneDay(item.date);
          const itemYear = d && !isNaN(d) ? String(d.getFullYear()) : '';
          matchesYear = itemYear === selectedYear;
        }

        let matchesRating = true;
        if (selectedRatingFilter === 'missing') {
          const r = String(item.rating || '').trim();
          matchesRating = (r === '' || r === '0' || isNaN(Number(r)) || Number(r) === 0);
        }

        return matchesSearch && matchesGenre && matchesYear && matchesRating;
      });

      filtered.sort((a, b) => {
        let valA = a[currentSort.column] || '';
        let valB = b[currentSort.column] || '';
        if (currentSort.column === 'date') {
          valA = addOneDay(a.date) || new Date(0);
          valB = addOneDay(b.date) || new Date(0);
        } else {
          if (typeof valA === 'string') valA = valA.toLowerCase();
          if (typeof valB === 'string') valB = valB.toLowerCase();
        }

        if (valA < valB) return currentSort.asc ? -1 : 1;
        if (valA > valB) return currentSort.asc ? 1 : -1;
        return 0;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="loading-msg">Ingen albums fundet, der matcher dine filtre.</div>';
        updateSelectedCount();
        return;
      }

      const getArrow = (col) => currentSort.column === col ? (currentSort.asc ? '▲' : '▼') : '';

      container.innerHTML = '<div class="table-container">' +
        '<table class="vault-table" id="main-vault-table">' +
          '<thead>' +
            '<tr>' +
              '<th style="width: 45px;"><input type="checkbox" onclick="toggleSelectAll(this)"></th>' +
              '<th><div class="th-content" onclick="sortTable(\'artist\')">Band <span>' + getArrow('artist') + '</span></div></th>' +
              '<th><div class="th-content" onclick="sortTable(\'title\')">Albumtitel <span>' + getArrow('title') + '</span></div></th>' +
              '<th style="width: 150px;"><div class="th-content" onclick="sortTable(\'date\')">Udgivelsesdato <span>' + getArrow('date') + '</span></div></th>' +
              '<th style="width: 170px;"><div class="th-content" onclick="sortTable(\'genre\')">Genre <span>' + getArrow('genre') + '</span></div></th>' +
              '<th style="width: 190px;"><div class="th-content" onclick="sortTable(\'rating\')">Karakter <span>' + getArrow('rating') + '</span></div></th>' +
            '</tr>' +
          '</thead>' +
          '<tbody>' +
            filtered.map((item, idx) => {
              const formattedDate = formatDateDK(item.date);
              const rVal = String(item.rating || '').trim();
              const missingRating = (rVal === '' || rVal === '0' || Number(rVal) === 0 || isNaN(Number(rVal)));
              const rowClass = (missingRating ? 'row-missing-rating ' : '') + (isAdmin ? 'clickable-row' : '');
              const rowId = item.id || ("row_" + (idx+1));
              const skullRatingHtml = renderSkulls(item.rating || 0, rowId);

              return '<tr class="' + rowClass + '" ' + (isAdmin ? 'onclick="openEditModal(\'' + rowId + '\')"' : '') + '>' +
                '<td onclick="event.stopPropagation()"><input type="checkbox" class="row-checkbox" value="' + rowId + '" onchange="updateSelectedCount()"></td>' +
                '<td ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'artist\'); event.stopPropagation();"' : '') + '>' + (item.artist || '') + '</td>' +
                '<td style="font-weight:600;" ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'title\'); event.stopPropagation();"' : '') + '>' +
                  '<div style="display: flex; align-items: center; gap: 10px;">' +
                    (item.cover ? '<img src="' + item.cover + '" style="width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0;" onerror="this.style.display=\'none\'">' : '') +
                    '<span>' + (item.title || '') + '</span>' +
                    (item.spotify ? '<a href="' + item.spotify + '" target="_blank" onclick="event.stopPropagation()" title="Åbn i Spotify" style="color: #1DB954; font-size: 1.2rem; text-decoration: none; margin-left: auto; flex-shrink: 0;">🟢</a>' : '') +
                  '</div>' +
                '</td>' +
                '<td ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'date\'); event.stopPropagation();"' : '') + '>' + formattedDate + '</td>' +
                '<td ' + (isAdmin ? 'ondblclick="makeEditable(this, \'' + rowId + '\', \'genre\'); event.stopPropagation();"' : '') + '>' + (item.genre || '') + '</td>' +
                '<td onclick="event.stopPropagation()">' + skullRatingHtml + '</td>' +
              '</tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div>';
      
      updateSelectedCount();
    }
  </script>
</body>
</html>
